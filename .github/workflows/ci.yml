name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest pytest-cov ruff mypy bandit pip-audit types-PyYAML
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Type check (mypy --strict)
        run: mypy
      - name: Tests (coverage gate 80% on services)
        run: pytest --cov=app --cov-report=term-missing && pytest -q --cov=app/services --cov-fail-under=80
      - name: Security scan (bandit)
        run: bandit -q -r app -c pyproject.toml
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Migrations apply cleanly
        run: DATABASE_URL=sqlite:///./ci.db alembic upgrade head
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
