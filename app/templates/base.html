<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <meta name="description" content="AgentHub — governed, multi-model AI agents with role-based access, cost controls and full audit.">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false}'>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/plus-jakarta-sans-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/htmx.min.js" defer></script>
  <script src="/static/js/app.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
{% block body %}{% endblock %}
</body>
</html>
