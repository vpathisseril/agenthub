[project]
name = "agenthub"
version = "1.0.0"
description = "AgentHub — a governed, multi-model AI agent platform (prototype)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2",
  "cryptography>=43",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "bandit>=1.7", "pip-audit>=2.7", "types-PyYAML"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends() idiom; E501: ruff format owns wrapping

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"scripts/*" = ["S311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
